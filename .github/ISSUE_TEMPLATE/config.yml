contact_links:
  - name: Report a security vulnerability
    url: https://github.com/mudhairless/freebasicd/security/advisories/new
    about: Private and unpublicized until a fix ships. Please do not use a
      public issue for a vulnerability. See SECURITY.md for what counts as one.
  - name: Question about FreeBASIC itself
    url: https://www.freebasic.net/wiki/DocToc
    about: The language reference for FreeBASIC is the FreeBASIC wiki. If the
      server and the wiki disagree, that is a divergence report, not a
      question.
