name: CI

# Two jobs, and nothing else:
#   build-test    configure + build + ctest on Linux (gcc and clang), macOS
#                 (AppleClang), and Windows (MSVC), then install the tree into
#                 a scratch prefix and check what landed in it.
#   clang-format  the formatting gate AGENTS.md calls part of the milestone
#                 gate, run on Linux only with a pinned clang-format.
#
# The first run lands with the repository push. Nothing here has ever run on
# GitHub, so treat the macOS and Windows legs as unproven until they are green
# (PLAN.md, M18).

"on":
  push:
    branches: [main]
    # Markdown-only pushes (PLAN, README, hygiene files) cannot break a build.
    # "**/*.md", not "**.md": the latter does not match a root-level .md, and a
    # docs-only push ran all five legs anyway (observed on eecbf81, an
    # AGENTS.md + PLAN.md commit).
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the formatter to the system version (Arch tracks the latest LLVM;
  # AGENTS.md, "Run the system-installed clang-format"). Keep local runs and CI
  # on the same formatter so a drift shows up as a code change, not a tool
  # difference. Bump this to the system version, in its own commit, when the
  # two disagree.
  CLANG_FORMAT_VERSION: "23.1.1"
  # GNU gettext for the Windows leg: there is no system one, and the CMake
  # build compiles every po file to a .mo with msgfmt. Two archives, because
  # mlocati splits the release: the plain bundle has the tools but no headers,
  # and the -dev-msvc bundle has libintl.h plus the MSVC import library but no
  # executables. Both unzip to the same bin/include/lib layout, so extracting
  # both into one directory yields a prefix that satisfies FindGettext (tools)
  # and FindIntl (header + library) at once.
  GETTEXT_WINDOWS_TOOLS_URL: >-
    https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.19/gettext1.0-iconv1.19-shared-64.zip
  GETTEXT_WINDOWS_DEV_URL: >-
    https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.19/gettext1.0-iconv1.19-shared-64-dev-msvc.zip

jobs:
  build-test:
    name: build+test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # One broken leg must not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux/gcc
            gettext: apt
            cmake_args: -DCMAKE_CXX_COMPILER=g++
          - os: ubuntu-latest
            label: linux/clang
            gettext: apt
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - os: macos-latest
            label: macos/appleclang
            gettext: brew
            cmake_args: ""
          - os: windows-latest
            label: windows/msvc
            gettext: zip
            cmake_args: ""
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v7
        with:
          # Both dependencies are submodules; a shallow, submodule-less
          # checkout does not configure.
          submodules: recursive

      # gettext: the tools build the 29 catalogs (msgfmt), and i18n_checks
      # builds one of its own at configure time. The install check below
      # counts the catalogs, so a leg that silently skipped them fails there.
      - name: Install gettext (Linux)
        if: matrix.gettext == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gettext
          msgfmt --version | head -1

      - name: Install gettext (macOS)
        if: matrix.gettext == 'brew'
        run: |
          brew install gettext
          # Homebrew keeps gettext keg-only, so its tools are not on PATH and
          # FindGettext would not see them without this.
          printf '%s\n' "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          msgfmt --version | head -1

      - name: Install gettext (Windows)
        if: matrix.gettext == 'zip'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'gettext'
          $archives = @($env:GETTEXT_WINDOWS_TOOLS_URL, $env:GETTEXT_WINDOWS_DEV_URL)
          foreach ($url in $archives) {
            $zip = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($url))
            Invoke-WebRequest $url -OutFile $zip
            Expand-Archive $zip -DestinationPath $dest -Force
          }
          # Do not assume the archives' internal layout: find the tool and take
          # its prefix, so a repack cannot silently break the build. Assert both
          # halves here rather than in configure, where a missing header or
          # import library reads as an unrelated find_library failure.
          $msgfmt = Get-ChildItem -Path $dest -Recurse -Filter 'msgfmt.exe' |
            Select-Object -First 1
          if (-not $msgfmt) { throw "msgfmt.exe missing from $archives" }
          $root = $msgfmt.Directory.Parent.FullName
          if (-not (Test-Path (Join-Path $root 'include\libintl.h'))) {
            # ${root}, not $root: PowerShell reads "$root:" as a drive-qualified
            # variable and the whole script stops parsing.
            throw "libintl.h missing under ${root}: the -dev-msvc bundle did not land"
          }
          Write-Host "gettext root: $root"
          # One PATH entry serves configure, build, and test: the tools
          # (msgfmt, msgmerge) and the runtime DLLs both live in bin.
          "$($msgfmt.Directory.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "GETTEXT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$($msgfmt.FullName)" --version | Select-Object -First 1

      # One configure step per gettext flavour, rather than one step that
      # branches on the shell: each leg then reads as the exact command that
      # runs, which is what a failed first run needs.
      - name: Configure (system gettext)
        if: matrix.gettext == 'apt'
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=/usr ${{ matrix.cmake_args }}

      - name: Configure (Homebrew gettext)
        if: matrix.gettext == 'brew'
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix gettext)" ${{ matrix.cmake_args }}

      - name: Configure (downloaded gettext)
        if: matrix.gettext == 'zip'
        shell: pwsh
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          "-DGETTEXT_ROOT=$env:GETTEXT_ROOT" ${{ matrix.cmake_args }}

      # --config Release drives the multi-config generator on Windows and is
      # ignored by the single-config generators on Linux and macOS.
      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        # --timeout bounds a hang. ctest's own default is 1500s, which is how a
        # wedged session_integration once held the Windows leg for the whole
        # job; 300s is ~20x the whole local suite and still fails fast. ctest
        # prints a timed-out test's captured output, so session_integration's
        # per-test progress lines name the one that stopped.
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      # The install rules are the only release-shaped thing this project has,
      # so they get a test: a scratch prefix under the build directory, then
      # the tree is checked for the binary, the license, and every catalog.
      - name: Install into a scratch prefix
        run: cmake --install build --config Release --prefix build/install-prefix

      - name: Check the install tree
        run: >-
          cmake -DFBLANG_INSTALL_PREFIX=build/install-prefix
          -DFBLANG_EXPECT_CATALOGS=29 -P tools/check_install_tree.cmake

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pipx, not apt: the pin has to be the exact version used locally, and
      # the PyPI clang-format wheel is a single self-contained binary.
      #
      # Install, report the version, and gate in one step, because the PATH
      # entry is prepended rather than appended: the runner image ships its own
      # clang-format (18.1.3 on ubuntu-24.04) and GITHUB_PATH only appends,
      # which would let the image's binary quietly win over the pin.
      - name: Formatting gate
        run: |
          pipx install clang-format==${{ env.CLANG_FORMAT_VERSION }}
          pipx_bin=$(pipx environment --value PIPX_BIN_DIR)
          export PATH="$pipx_bin:$PATH"
          clang-format --version
          # Every tracked C++ file, not the glob the milestone gate used to
          # spell out: a new file in a new directory cannot escape this, and
          # the submodule's contents are not tracked by this repository. xargs
          # turns the list into arguments without an unquoted substitution.
          git ls-files '*.cpp' '*.h' | grep -v '^third_party/' \
            | xargs clang-format --dry-run --Werror
